_BASE_: "../sdd.res50.bs8.yaml"
# V2-H6 处理臂：训练 t 分布对齐推理网格 —— 50% 概率直接训 t=T-1（NFE=1 唯一
# 访问点），50% 均匀。其余与 sdd.res50.bs16.uniform.yaml（控制臂）完全一致。
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.0001          # 与控制臂一致
  MAX_ITER: 2000
  STEPS: (1600,)
  WARMUP_ITERS: 250
  CHECKPOINT_PERIOD: 1000
  AMP:
    ENABLED: False         # 与控制臂一致（fp16 bs16 崩溃，见 uniform.yaml 注释）
TEST:
  EVAL_PERIOD: 1000
DATALOADER:
  NUM_WORKERS: 8
MODEL:
  DiffusionDet:
    TRAIN_T_DIST: "mix_tmax"
    TRAIN_T_HIGH_PROB: 0.5
OUTPUT_DIR: "output/lab/v2/sdd.bs16.tmix"
VERSION: 2
