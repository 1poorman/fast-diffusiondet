_BASE_: "Base-DiffusionDet.yaml"
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  RESNETS:
    DEPTH: 50
    STRIDE_IN_1X1: False
  DiffusionDet:
    NUM_PROPOSALS: 500
    NUM_CLASSES: 8
DATASETS:
  TRAIN: ("wgisd_train",)
  TEST:  ("wgisd_val",)
TEST:
  EVAL_PERIOD: 5000
SOLVER:
  IMS_PER_BATCH: 1
  BASE_LR: 0.00025
  STEPS: (350000, 420000)
  MAX_ITER: 450000
  CHECKPOINT_PERIOD: 150000
INPUT:
  CROP:
    ENABLED: True
  FORMAT: "RGB"
OUTPUT_DIR: 'output/wgisd.res50'
